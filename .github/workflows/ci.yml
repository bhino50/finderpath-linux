name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Validate FinderPath Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate
        run: |
          python3 -m py_compile finderpath_linux.py
          python3 finderpath_linux.py --self-test
          bash -n install.sh
          bash -n uninstall.sh
