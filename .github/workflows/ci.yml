name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Validate FinderPath Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate
        run: |
          python3 -m py_compile finderpath_linux.py
          python3 finderpath_linux.py --self-test
          python3 finderpath_linux.py doctor
          bash -n install.sh
          bash -n uninstall.sh
          bash -n scripts/package_release.sh

      - name: Validate desktop installer output
        run: |
          if ! command -v desktop-file-validate >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y desktop-file-utils
          fi

          tmp_home="$(mktemp -d)"
          HOME="$tmp_home" ./install.sh --skip-deps
          desktop-file-validate "$tmp_home/.local/share/applications/io.github.bhino50.FinderPathLinux.desktop"
          desktop-file-validate "$tmp_home/.local/share/applications/io.github.bhino50.FinderPathLinux.Settings.desktop"

          HOME="$tmp_home" ./uninstall.sh
          test ! -e "$tmp_home/.local/bin/finderpath-linux"
          test ! -e "$tmp_home/.local/share/applications/io.github.bhino50.FinderPathLinux.desktop"
          test ! -e "$tmp_home/.local/share/applications/io.github.bhino50.FinderPathLinux.Settings.desktop"
          rm -rf "$tmp_home"

      - name: Validate release installer
        run: |
          VERSION=ci ./scripts/package_release.sh
          test -s dist/finderpath-linux-ci.tar.gz
          test -x dist/finderpath-linux-installer.sh
          test -x dist/finderpath-linux-ci-installer.sh
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

          tmp_home="$(mktemp -d)"
          HOME="$tmp_home" ./dist/finderpath-linux-installer.sh --skip-deps
          "$tmp_home/.local/bin/finderpath-linux" --self-test
          "$tmp_home/.local/bin/finderpath-linux" doctor
          rm -rf "$tmp_home"

      - name: Validate no-sudo installer fallback
        run: |
          docker run --rm -v "$PWD:/repo:ro" ubuntu:22.04 bash -lc '
            set -euo pipefail
            apt-get update >/dev/null
            apt-get install -y python3 >/dev/null
            useradd -m tester
            su -s /bin/bash tester -c "
              set -euo pipefail
              /repo/dist/finderpath-linux-installer.sh --yes > /tmp/finderpath-install.log
              grep -q \"Cannot install system packages automatically\" /tmp/finderpath-install.log
              test -x \"\$HOME/.local/bin/finderpath-linux\"
              \"\$HOME/.local/bin/finderpath-linux\" --self-test
            "
          '
